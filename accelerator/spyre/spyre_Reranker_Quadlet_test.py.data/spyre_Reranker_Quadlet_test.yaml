# Spyre Quadlet Test Configuration — Reranker
# USE_CASE is fixed to "reranker" in the test file; no parameter needed here.

# Required: RHAIIS version (e.g. "3.3", "3.4", "3.5", "3.6")
RHAIIS_VERSION: ""

# AIU PCIe device IDs (space-separated); only the first ID is used
# Example: "0301:50:00.0"
AIU_PCIE_IDS: ""

# Model configuration
HOST_MODELS_DIR: "/opt/ibm/spyre/models/src"
VLLM_MODEL_PATH: "/models/bge-reranker-v2-m3"
HF_MODEL_NAME: "BAAI/bge-reranker-v2-m3"
AIU_WORLD_SIZE: "1"
MAX_MODEL_LEN: "1024"
MAX_BATCH_SIZE: "4"

# Container configuration
CONTAINER_URL: ""
CONTAINER_TAG: ""
API_KEY: ""
DEVICE: "/dev/vfio"
USERNS: "keep-id"
GROUP_ADD: "keep-groups"
SECURITY_OPT: "label=disable"
PIDS_LIMIT: "0"
MEMORY: "50G"
PORT_MAPPING: "127.0.0.1:8000:8000"

# User / group configuration
SPYRE_GROUP: ""
USER: ""
