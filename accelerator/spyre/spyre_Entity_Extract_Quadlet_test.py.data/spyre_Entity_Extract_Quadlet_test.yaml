# Spyre Quadlet Test Configuration — Entity Extraction
# USE_CASE is fixed to "entity-extract" in the test file; no parameter needed here.

# Required: RHAIIS version (e.g. "3.3", "3.4", "3.5", "3.6")
# max_model_len / max_batch_size are derived from this:
#   3.3 / 3.4 / 3.5 -> 3072 / 16
#   3.6             -> 4096 / 32
RHAIIS_VERSION: ""

# AIU PCIe device IDs (space-separated)
# First ID is used; first TWO are used for Mistral-Small-3.2-24B-Instruct-2506
# Example: "0301:50:00.0"
AIU_PCIE_IDS: ""

# Model configuration
HOST_MODELS_DIR: "/opt/ibm/spyre/models/src"
VLLM_MODEL_PATH: "/models/granite-3.3-8b-instruct"
HF_MODEL_NAME: "ibm-granite/granite-3.3-8b-instruct"
AIU_WORLD_SIZE: "1"

# Container configuration
CONTAINER_URL: ""
CONTAINER_TAG: ""
API_KEY: ""
DEVICE: "/dev/vfio"
USERNS: "keep-id"
GROUP_ADD: "keep-groups"
SECURITY_OPT: "label=disable"
PIDS_LIMIT: "0"
MEMORY: "100G"
PORT_MAPPING: "127.0.0.1:8000:8000"

# User / group configuration
SPYRE_GROUP: ""
USER: ""
