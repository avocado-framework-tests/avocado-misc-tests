# Spyre Quadlet Test Configuration — RAG (Retrieval Augmented Generation)
# USE_CASE is fixed to "rag" in the test file; no parameter needed here.

# Required: RHAIIS version (e.g. "3.3", "3.4", "3.5", "3.6")
RHAIIS_VERSION: ""

# AIU PCIe device IDs — RAG uses ALL IDs (space-separated)
# Example: "0301:50:00.0 0302:60:00.0 0303:70:00.0 0304:80:00.0"
AIU_PCIE_IDS: ""

# Model configuration
HOST_MODELS_DIR: "/opt/ibm/spyre/models/src"
VLLM_MODEL_PATH: "/models/granite-3.3-8b-instruct"
HF_MODEL_NAME: "ibm-granite/granite-3.3-8b-instruct"
AIU_WORLD_SIZE: "4"
MAX_MODEL_LEN: "32768"
MAX_BATCH_SIZE: "32"

# Container configuration
CONTAINER_URL: ""
CONTAINER_TAG: ""
API_KEY: ""
DEVICE: "/dev/vfio"
USERNS: "keep-id"
GROUP_ADD: "keep-groups"
SECURITY_OPT: "label=disable"
PIDS_LIMIT: "0"
MEMORY: "200G"
SHM_SIZE: "2G"
PORT_MAPPING: "127.0.0.1:8000:8000"

# User / group configuration
SPYRE_GROUP: ""
USER: ""
