# Configuration for large memory systems (> 4 TiB).
# See README for parameter descriptions.
url: "https://github.com/ColinIanKing/stress-ng/archive/V0.21.04.zip"
base_time: 300
time_per_gig: 10
max_vrt_time: 7200
mem_per_worker: 20
memory_target_percent: 70
max_cpu_load: 80
crt_stressors: ["bsearch", "context", "hsearch", "lsearch", "matrix", "memcpy",
                "null", "pipe", "qsort", "stack", "str", "stream", "tsearch",
                "vm-rw", "wcs", "zero", "mlock", "mmapfork", "mmapmany",
                "mremap", "shm-sysv", "vm-splice"]
vrt_stressors: ["malloc", "mincore", "vm", "bigheap", "brk", "mmap"]
