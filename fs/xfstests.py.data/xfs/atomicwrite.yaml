scratch_mnt: '/mnt/scratch'
test_mnt: '/mnt/test'

disk_type:
    type: 'nvme'
    # NVMe namespace device to partition for testing (e.g. /dev/nvme0n1)
    disk: "null"

# aw_blksize is compared against atomic_write_unit_max_bytes at runtime
fs_type: !mux
    fs_xfs_aw_4k:
        fs: 'xfs'
        args: '-R xunit -L 10 -g auto'
        mkfs_opt: '-f -b size=4096'
        mount_opt: ''
        aw_blksize: 4096
    fs_xfs_aw_16k:
        fs: 'xfs'
        args: '-R xunit -L 10 -g auto'
        mkfs_opt: '-f -b size=16384'
        mount_opt: ''
        aw_blksize: 16384
    fs_xfs_aw_64k:
        fs: 'xfs'
        args: '-R xunit -L 10 -g auto'
        mkfs_opt: '-f -b size=65536'
        mount_opt: ''
        aw_blksize: 65536
